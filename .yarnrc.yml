# SPDX-License-Identifier: FSL-1.1-MIT

compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.14.1.cjs

enableHardenedMode: true

npmMinimalAgeGate: 10080 # minutes (7 days)

# Allow the in-house packages we consume to bypass the age gate.
# Deliberately exact names instead of '@safe-global/*': a compromised
# org publish token should not get an instant path into CI for every
# package under the scope.
npmPreapprovedPackages:
  - '@safe-global/safe-deployments'
  - '@safe-global/safe-modules-deployments'
