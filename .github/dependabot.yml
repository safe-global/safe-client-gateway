version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7 # Aligns with minimumReleaseAge / npmMinimalAgeGate
    groups:
      nest-js:
        patterns:
          # Nest majors are only installable in lockstep: a v12 package deep-imports
          # paths that v11 siblings do not expose. `nestjs-cls` bounds Nest by peer
          # range, so it has to move in the same PR.
          - '@nestjs/*'
          - 'nestjs-cls'
      aws-sdk:
        patterns:
          - '@aws-sdk/*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7 # Aligns with minimumReleaseAge / npmMinimalAgeGate

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
