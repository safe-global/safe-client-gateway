name: CI

# What is left of the old monolith: the RELEASE image build, and nothing else.
#
#   * Pull requests  → pull-request.yml
#   * Push to main   → staging.yml (build + GitOps deploy to staging)
#   * Published release → this file, until production.yml replaces it
#
# The `push` trigger is gone: staging.yml now owns the trunk event, and leaving
# it here would run the quality gate twice on every merge to main.
#
# Both entry points call the same _ci-node.yml, so there is still exactly one
# definition of the quality gate.
on:
  release:
    types: [released]

# A release build is never cancelled. Distinct releases carry distinct tag refs
# and so land in distinct groups anyway; this is belt-and-braces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_IMAGE_REGISTRY: safeglobal
  DOCKER_IMAGE_NAME: safe-client-gateway-nest
  GHCR_IMAGE: ghcr.io/safe-global/safe-client-gateway
  DOCKER_BUILD_IMAGE_TAG: buildcache

jobs:
  # The quality gate, shared with pull-request.yml and staging.yml. Job names
  # inside a reusable are reported as `ci / <job>`.
  ci:
    uses: ./.github/workflows/_ci-node.yml
    secrets: inherit

  docker-publish-release:
    if: (github.event_name == 'release' && github.event.action == 'released')
    needs: [ci]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          BUILD_NUMBER=${{ github.sha }}
          echo "BUILD_NUMBER=${BUILD_NUMBER::7}" >> "$GITHUB_ENV"
      - name: Validate release tag
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "Release tag is empty; refusing to publish an untagged release image."
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            VERSION=${{ env.RELEASE_TAG }}
          tags: |
            ${{ env.DOCKER_IMAGE_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.DOCKER_IMAGE_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.GHCR_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.GHCR_IMAGE }}:latest
          # Use Registry cache backend https://docs.docker.com/build/cache/backends/registry/
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_BUILD_IMAGE_TAG }}
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_BUILD_IMAGE_TAG }},mode=max
