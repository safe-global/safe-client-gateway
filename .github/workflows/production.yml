# SPDX-License-Identifier: FSL-1.1-MIT
# =============================================================================
# CALLER: GitHub Release → PRODUCTION
# =============================================================================
# Triggered when a GitHub Release is published (tag vX.Y.Z), which is cut by
# hand. Runs CI on the release commit, builds an immutable image tagged with the
# release version, then GitOps-deploys it to production with a health gate:
# ArgoCD wait + /about version poll + smoke test.
#
# The gate does NOT auto-rollback on a release: it fails loudly and recovery is
# roll-forward. This service ships TypeORM migrations, and reverting the image
# across a migration leaves code and schema mismatched.
#
# workflow_dispatch deploys the tag you pass as `tag`, running THIS (fixed)
# workflow from the default branch. It serves both as the recovery path for a
# release whose own run was broken, and as a way to ship an existing tag with no
# Release object behind it. Note that a dispatch emits no `release` event, so
# linear-release.yml does not run and no release notes are produced.
# -----------------------------------------------------------------------------
name: Production

on:
  # `released`, not `published`, matching linear-release.yml. The two
  # differ in more than pre-release coverage: `published` does not fire again
  # when a pre-release is promoted to a full release, so that flow would tag a
  # release and silently never deploy it. `released` covers the promotion.
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag / version to build and deploy (e.g. v1.126.0).
        type: string
        required: true
      auto_rollback:
        description: >-
          Revert the image bump if the health gate fails (ArgoCD rolls back to
          the previous tag). Leave OFF when the tag carries a DB migration —
          reverting across a migration breaks the service (recover forward).
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    secrets: inherit

  prepare:
    # Same guard as `build` below: nothing downstream runs for a prerelease, so
    # there is no reason to spend a runner on this either.
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      auto_rollback: ${{ steps.rollback.outputs.auto_rollback }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # On a dispatch the tag is typed by hand. Without this, a typo travels
          # through the whole quality gate and only fails minutes later, at the
          # checkout inside _build-image.yml. A release event needs no check: the
          # tag is what fired it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1 \
              || { echo "::error::Tag ${TAG} does not exist in ${GITHUB_REPOSITORY}"; exit 1; }
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Roll-forward by default. A failed health gate fails loudly and is
      # recovered FORWARD, never auto-reverted. Auto-rollback is opt-in and only
      # via manual dispatch, for a deploy the operator knows is migration-free.
      - id: rollback
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_ROLLBACK: ${{ inputs.auto_rollback }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch — auto_rollback=${DISPATCH_ROLLBACK} (operator opt-in)."
            echo "auto_rollback=${DISPATCH_ROLLBACK}" >> "$GITHUB_OUTPUT"
          else
            echo "Release event — auto_rollback=false (roll forward on failure)."
            echo "auto_rollback=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [ci, prepare]
    # Build on manual dispatch, or on any non-prerelease GitHub Release.
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: ghcr.io/safe-global/safe-client-gateway
      # GHCR only. Releases are no longer mirrored to the public Docker Hub
      # image: the licence boundary is 2026-02-16, so everything built from
      # v1.102.0 onward is FSL-1.1-MIT rather than MIT, and the external
      # consumers of safeglobal/safe-client-gateway-nest are pinned to MIT-era
      # tags that already exist there (v1.29.0, v1.96.0 and a digest). Those
      # tags are immutable and stay published, so nothing breaks by stopping.
      # _build-image.yml keeps the docker_image input, so restoring the mirror
      # is one line if that decision changes.
      image_tag: ${{ needs.prepare.outputs.tag }}
      # Must equal image_tag — /about reports it and _deploy.yml polls for it.
      version: ${{ needs.prepare.outputs.tag }}
      # Always true whenever this job runs, since it repeats the guard above —
      # kept rather than hard-coded because it states the rule at the point of
      # use. On a dispatch it is deliberate: a dispatch deploys to production
      # too, so `latest` must follow whatever production ends up running.
      also_tag_latest: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
      # On dispatch, build the exact tagged source, not the default branch HEAD.
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  deploy-production:
    needs: [prepare, build]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.prepare.outputs.tag }}
      infra_repo: safe-global/safe-client-gateway-infra-tf
      values_file: apps/safe-client-gateway/values-production.yaml
      image_tag_path: .client.imageTag
      argocd_app: safe-client-gateway
      health_url: https://safe-client.safe.global/health/ready
      # VPN-free rollout confirmation in addition to the ArgoCD wait. /about, not
      # /v1/about: AboutController declares no version and app.provider.ts enables
      # URI versioning with no default, so /v1/about 404s. Production also sits
      # behind CloudFront, which rejects any User-Agent that does not look like a
      # browser's — _deploy.yml sends one that satisfies it.
      version_check_url: https://safe-client.safe.global/about
      health_gate: true
      auto_rollback: ${{ needs.prepare.outputs.auto_rollback == 'true' }}
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}
      argocd_server: ${{ secrets.ARGOCD_SERVER }}
      vpn_secret: ${{ secrets.VPN_SECRET_NAME }}
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
      argocd_token_secret: ${{ secrets.ARGOCD_TOKEN_SECRET_NAME }}
