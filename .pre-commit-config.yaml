# SPDX-License-Identifier: FSL-1.1-MIT
repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5

    hooks:
      - id: insert-license
        name: insert-license
        files: \.(ts|tsx|js|mjs)$
        exclude: (node_modules/|dist/|coverage/|abis/)
        stages: [pre-commit]
        args:
          - --license-filepath
          - LICENSE_HEADER.txt
          - --comment-style
          - //
          - --no-extra-eol
      - id: insert-license
        name: insert-license
        files: \.(yaml|yml|sh|Dockerfile)$
        exclude: (node_modules/|dist/|coverage/|abis/)
        stages: [pre-commit]
        args:
          - --license-filepath
          - LICENSE_HEADER.txt
          - --comment-style
          - '#'
          - --no-extra-eol
      - id: insert-license
        name: insert-license
        files: \.(md)$
        # .claude/ markdown files are Claude Code skills and commands: their YAML
        # frontmatter must be the first line, so a header cannot be prepended.
        exclude: (node_modules/|dist/|coverage/|abis/|\.claude/)
        stages: [pre-commit]
        args:
          - --license-filepath
          - LICENSE_HEADER.txt
          - --comment-style
          - '<!--| | -->'
          - --no-extra-eol
      - id: insert-license
        name: insert-license
        files: \.(sql)$
        exclude: (node_modules/|dist/|coverage/|abis/)
        stages: [pre-commit]
        args:
          - --license-filepath
          - LICENSE_HEADER.txt
          - --comment-style=--
          - --no-extra-eol
