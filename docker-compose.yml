services:
  redis:
    image: redis/redis-stack:7.2.0-v10
    ports:
      - ${REDIS_PORT-6379}:${REDIS_PORT-6379}
      - 8001:8001

  db:
    image: postgres:14.8-alpine
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./db_config/test/server.crt:/var/lib/postgresql/server.crt:ro
      - ./db_config/test/server.key:/var/lib/postgresql/server.key:ro
      - ./db_config/test/pg_hba.conf:/etc/pg_hba.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safe-client-gateway}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c hba_file=/etc/pg_hba.conf

  db-test:
    image: postgres:14.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-test-db}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    volumes:
      - ./db_config/test/server.crt:/var/lib/postgresql/server.crt:ro
      - ./db_config/test/server.key:/var/lib/postgresql/server.key:ro
      - ./db_config/test/pg_hba.conf:/etc/pg_hba.conf
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c hba_file=/etc/pg_hba.conf

  rabbitmq:
    image: rabbitmq:management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 30s
      retries: 3
      start_period: 15s

  web:
    build: .
    tty: true
    environment:
      REDIS_HOST: redis
      # The in-network Postgres (the `db` service requires SSL; the image has
      # no CA bundle, so the self-signed cert is accepted explicitly).
      # Hardcoded like REDIS_HOST: a host-side POSTGRES_HOST (e.g. from .env)
      # must not leak into the container, where only `db` is reachable.
      POSTGRES_HOST: db
      POSTGRES_SSL_ENABLED: 'true'
      POSTGRES_SSL_REJECT_UNAUTHORIZED: 'false'
      AMQP_URL: ${AMQP_URL-amqp://rabbitmq:5672}
      PRICES_PROVIDER_API_KEY: ${PRICES_PROVIDER_API_KEY-example_api_key}
      APPLICATION_PORT: ${APPLICATION_PORT-3000}
      # Pure passthrough from the host env (e.g. op run/1Password): compose
      # only forwards the variables listed here. CORS needs BOTH set
      # (CGW_ENV=development + ALLOW_CORS=true, see src/main.ts).
      CGW_ENV: ${CGW_ENV-}
      ALLOW_CORS: ${ALLOW_CORS-}
      AUTH_TOKEN: ${AUTH_TOKEN-example_auth_token}
      AUTH_POST_LOGIN_REDIRECT_URI: ${AUTH_POST_LOGIN_REDIRECT_URI-http://localhost:3000}
      # Without this, returnUrl validation is strict same-origin against
      # AUTH_POST_LOGIN_REDIRECT_URI (see auth-redirect.helper.ts).
      AUTH_ALLOWED_REDIRECT_DOMAIN: ${AUTH_ALLOWED_REDIRECT_DOMAIN-}
      BLOCKLIST_ENCRYPTED_DATA: ${BLOCKLIST_ENCRYPTED_DATA-fake-encrypted-data}
      BLOCKLIST_SECRET_KEY: ${BLOCKLIST_SECRET_KEY-fake-secret-key}
      BLOCKLIST_SECRET_SALT: ${BLOCKLIST_SECRET_SALT-fake-secret-salt}
      BRIDGE_API_KEY: ${BRIDGE_API_KEY-example_api_key}
      CSV_AWS_ACCESS_KEY_ID: ${CSV_AWS_ACCESS_KEY_ID-example_key_id}
      CSV_AWS_SECRET_ACCESS_KEY: ${CSV_AWS_SECRET_ACCESS_KEY-example_secret}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID-example_key_id}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY-example_secret}
      AWS_REGION: ${AWS_REGION-eu-west-1}
      EMAIL_API_APPLICATION_CODE: ${EMAIL_API_APPLICATION_CODE-example_application_code}
      EMAIL_API_FROM_EMAIL: ${EMAIL_API_FROM_EMAIL-changeme@example.com}
      EMAIL_API_KEY: ${EMAIL_API_KEY-example_api_key}
      FINGERPRINT_ENCRYPTION_KEY: ${FINGERPRINT_ENCRYPTION_KEY-example_encryption_key}
      INFURA_API_KEY: ${INFURA_API_KEY-example_api_key}
      JWT_ISSUER: ${JWT_ISSUER-example_issuer}
      JWT_SECRET: ${JWT_SECRET-example_secret}
      PUSH_NOTIFICATIONS_API_PROJECT: ${PUSH_NOTIFICATIONS_API_PROJECT-example_project}
      PUSH_NOTIFICATIONS_API_SERVICE_ACCOUNT_CLIENT_EMAIL: ${PUSH_NOTIFICATIONS_API_SERVICE_ACCOUNT_CLIENT_EMAIL-fake@example.com}
      PUSH_NOTIFICATIONS_API_SERVICE_ACCOUNT_PRIVATE_KEY: ${PUSH_NOTIFICATIONS_API_SERVICE_ACCOUNT_PRIVATE_KEY-example_private_key}
      STAKING_API_KEY: ${STAKING_API_KEY-example_api_key}
      STAKING_TESTNET_API_KEY: ${STAKING_TESTNET_API_KEY-example_api_key}
      # Entitlements / billing (see src/modules/billing/README.md). The
      # billing-service token is only needed when FF_BILLING_SERVICE=true.
      FF_AUTH: ${FF_AUTH-false}
      FF_USERS: ${FF_USERS-false}
      FF_BILLING_SERVICE: ${FF_BILLING_SERVICE-false}
      BILLING_WEBHOOK_JWT_PUBLIC_KEY: ${BILLING_WEBHOOK_JWT_PUBLIC_KEY-}
      SAFE_BILLING_SERVICE_BASE_URI: ${SAFE_BILLING_SERVICE_BASE_URI-}
      SAFE_BILLING_SERVICE_API_TOKEN: ${SAFE_BILLING_SERVICE_API_TOKEN-example_api_token}
      RELAY_PROVIDER_API_KEY_OPTIMISM: ${RELAY_PROVIDER_API_KEY_OPTIMISM-example_api_key}
      RELAY_PROVIDER_API_KEY_BSC: ${RELAY_PROVIDER_API_KEY_BSC-example_api_key}
      RELAY_PROVIDER_API_KEY_GNOSIS_CHAIN: ${RELAY_PROVIDER_API_KEY_GNOSIS_CHAIN-example_api_key}
      RELAY_PROVIDER_API_KEY_POLYGON: ${RELAY_PROVIDER_API_KEY_POLYGON-example_api_key}
      RELAY_PROVIDER_API_KEY_POLYGON_ZKEVM: ${RELAY_PROVIDER_API_KEY_POLYGON_ZKEVM-example_api_key}
      RELAY_PROVIDER_API_KEY_BASE: ${RELAY_PROVIDER_API_KEY_BASE-example_api_key}
      RELAY_PROVIDER_API_KEY_ARBITRUM_ONE: ${RELAY_PROVIDER_API_KEY_ARBITRUM_ONE-example_api_key}
      RELAY_PROVIDER_API_KEY_AVALANCHE: ${RELAY_PROVIDER_API_KEY_AVALANCHE-example_api_key}
      RELAY_PROVIDER_API_KEY_LINEA: ${RELAY_PROVIDER_API_KEY_LINEA-example_api_key}
      RELAY_PROVIDER_API_KEY_BLAST: ${RELAY_PROVIDER_API_KEY_BLAST-example_api_key}
      RELAY_PROVIDER_API_KEY_UNICHAIN: ${RELAY_PROVIDER_API_KEY_UNICHAIN-example_api_key}
      RELAY_PROVIDER_API_KEY_SEPOLIA: ${RELAY_PROVIDER_API_KEY_SEPOLIA-example_api_key}
    depends_on:
      - redis
      - db
      - rabbitmq

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - '8888:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${POSTGRES_ADMIN_USER:-admin@test.dev}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_ADMIN_PASS:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  nginx:
    image: nginx:1.25-alpine
    ports:
      - ${NGINX_HOST_PORT:-8080}:80
    volumes:
      - ./nginx/templates:/etc/nginx/templates
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/
      APPLICATION_PORT: ${APPLICATION_PORT-3000}
    depends_on:
      - web

volumes:
  pgadmin-data:
